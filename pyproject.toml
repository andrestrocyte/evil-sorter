[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evil-sorter"
version = "0.1.0"
description = "Manual native-component curation for evil_caiman outputs"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "h5py", "Pillow"]

[project.scripts]
evil-sorter = "evil_sorter.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

